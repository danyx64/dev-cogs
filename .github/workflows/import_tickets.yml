name: Import Tickets from Vrt Cogs

on:
  push:
    paths:
      - '.github/workflows/import_tickets.yml'

permissions:
  contents: write

jobs:
  import-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import exact Tickets source
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tickets ] && [ -f tickets/tickets.py ]; then
            echo "tickets already exists; nothing to import"
            exit 0
          fi
          git clone --depth 1 https://github.com/vertyco/vrt-cogs.git /tmp/vrt-cogs
          cd /tmp/vrt-cogs
          git fetch --depth 1 origin f905b5a1d28cebeb7b165848a46b9114b85884ad
          git checkout --detach f905b5a1d28cebeb7b165848a46b9114b85884ad
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/vrt-cogs/tickets ./tickets
          cp /tmp/vrt-cogs/LICENSE ./tickets/LICENSE

      - name: Commit imported cog
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tickets && git diff --cached --quiet -- tickets; then
            git add tickets
          else
            git add tickets
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Tickets 3.5.1 from vertyco/vrt-cogs"
          git push origin HEAD:main
