name: Apply permission audit fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix_permission_audit.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited permission fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path, old, new, count=1):
              text = read(path)
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {found}: {old!r}')
              write(path, text.replace(old, new, count))

          # AgeGuard: keep automatic-kick policy changes administrator-only, but let
          # normal server managers configure harmless output and run diagnostics.
          p = 'ageguard/ageguard.py'
          text = read(p)
          for func in ('ag_setchannel', 'ag_message', 'ag_test'):
              marker = '@commands.admin_or_permissions(administrator=True)\n    async def ' + func
              replacement = '@commands.admin_or_permissions(manage_guild=True)\n    async def ' + func
              if marker not in text:
                  raise SystemExit(f'{p}: decorator marker missing for {func}')
              text = text.replace(marker, replacement, 1)
          text = text.replace('__version__ = "1.0.0"', '__version__ = "1.0.1"', 1)
          write(p, text)

          # LeaveFeed only changes its own server configuration/DM questionnaire;
          # Manage Server is sufficient. Apply to the active inheritance chain and
          # the retained compatibility base.
          for p in (
              'leavefeed/leavefeed.py',
              'leavefeed/leavefeed_base.py',
              'leavefeed/leavefeed_v3.py',
              'leavefeed/leavefeed_v4.py',
          ):
              text = read(p)
              if '@commands.admin_or_permissions(administrator=True)' not in text:
                  raise SystemExit(f'{p}: expected administrator decorators not found')
              text = text.replace(
                  '@commands.admin_or_permissions(administrator=True)',
                  '@commands.admin_or_permissions(manage_guild=True)',
              )
              write(p, text)
          replace_exact(
              'leavefeed/leavefeed_v5.py',
              '__version__ = "2.2.3"',
              '__version__ = "2.2.4"',
          )

          # Welcome configuration is server-level configuration, not a full
          # Administrator operation.
          p = 'welcome/welcome.py'
          text = read(p)
          if '@commands.admin_or_permissions(administrator=True)' not in text:
              raise SystemExit(f'{p}: expected administrator decorators not found')
          text = text.replace(
              '@commands.admin_or_permissions(administrator=True)',
              '@commands.admin_or_permissions(manage_guild=True)',
          )
          text = text.replace('__version__ = "2.6.0"', '__version__ = "2.6.1"', 1)
          write(p, text)

          # ServerLogger configuration and deletion of this cog's own archive can
          # be managed by members with Manage Server. Search remains moderator /
          # Manage Messages as before.
          for p in ('serverlogger/serverlogger.py', 'serverlogger/serverlogger_v4.py'):
              text = read(p)
              if '@commands.admin_or_permissions(administrator=True)' not in text:
                  raise SystemExit(f'{p}: expected administrator decorators not found')
              text = text.replace(
                  '@commands.admin_or_permissions(administrator=True)',
                  '@commands.admin_or_permissions(manage_guild=True)',
              )
              write(p, text)
          replace_exact(
              'serverlogger/serverlogger_v4.py',
              '__version__ = "1.7.0"',
              '__version__ = "1.7.1"',
          )

          # NitroRole: Manage Roles users must not be able to configure their own
          # highest role through the bot; Discord hierarchy requires strictly below.
          replace_exact(
              'nitrorole/nitrorole.py',
              'and role > ctx.author.top_role',
              'and role >= ctx.author.top_role',
          )
          replace_exact(
              'nitrorole/nitrorole.py',
              '__version__ = "1.0.0-it"',
              '__version__ = "1.0.1-it"',
          )

          # HierarchyAdmin: commands already accept ordinary Manage Roles users,
          # so mirror Discord's caller hierarchy instead of only checking the bot.
          p = 'hierarchyadmin/hierarchyadmin.py'
          old = '''        if not role.is_default() and role >= me.top_role:\n            await ctx.send("Non posso modificare un ruolo uguale o superiore al mio ruolo più alto.")\n            return False\n        return True\n'''
          new = '''        if not role.is_default() and role >= me.top_role:\n            await ctx.send("Non posso modificare un ruolo uguale o superiore al mio ruolo più alto.")\n            return False\n\n        author = ctx.author\n        if (\n            isinstance(author, discord.Member)\n            and author.id != ctx.guild.owner_id\n            and not author.guild_permissions.administrator\n            and not role.is_default()\n            and role >= author.top_role\n        ):\n            await ctx.send("Non puoi modificare un ruolo uguale o superiore al tuo ruolo più alto.")\n            return False\n        return True\n'''
          replace_exact(p, old, new)
          replace_exact(
              'hierarchyadmin/hierarchyadmin_v3.py',
              '__version__ = "1.2.0"',
              '__version__ = "1.2.1"',
          )
          PY

      - name: Validate permissions and syntax
        shell: bash
        run: |
          python -m compileall -q \
            ageguard leavefeed welcome serverlogger nitrorole hierarchyadmin
          python - <<'PY'
          from pathlib import Path

          checks = {
              'ageguard/ageguard.py': [
                  '@commands.admin_or_permissions(manage_guild=True)\n    async def ag_setchannel',
                  '@commands.admin_or_permissions(manage_guild=True)\n    async def ag_message',
                  '@commands.admin_or_permissions(manage_guild=True)\n    async def ag_test',
                  '@commands.admin_or_permissions(administrator=True)\n    async def ag_enable',
                  '@commands.admin_or_permissions(administrator=True)\n    async def ag_minage',
              ],
              'nitrorole/nitrorole.py': ['and role >= ctx.author.top_role'],
              'hierarchyadmin/hierarchyadmin.py': ['role >= author.top_role'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing validation marker {needle!r}')

          # These cogs should no longer require full Discord Administrator for
          # ordinary server configuration.
          for path in (
              'leavefeed/leavefeed.py',
              'leavefeed/leavefeed_base.py',
              'leavefeed/leavefeed_v3.py',
              'leavefeed/leavefeed_v4.py',
              'welcome/welcome.py',
              'serverlogger/serverlogger.py',
              'serverlogger/serverlogger_v4.py',
          ):
              text = Path(path).read_text(encoding='utf-8')
              if '@commands.admin_or_permissions(administrator=True)' in text:
                  raise SystemExit(f'{path}: unexpected Administrator-only decorator remains')

          # Critical persisted Config identities must remain untouched.
          identities = {
              'ageguard/ageguard.py': 'identifier=937410526481773204',
              'leavefeed/leavefeed.py': 'identifier=742951603118804261',
              'welcome/welcome.py': 'identifier=581244918377421006',
              'serverlogger/serverlogger.py': 'identifier=846217530194627311',
              'nitrorole/nitrorole.py': 'identifier=176070082584248320',
          }
          for path, marker in identities.items():
              if marker not in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'{path}: Config identity changed or missing')
          PY
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "DanyX64"
          git config user.email "124602162+danyx64@users.noreply.github.com"
          git add ageguard leavefeed welcome serverlogger nitrorole hierarchyadmin
          git commit -m "Fix cog permission checks"
          git push
