name: Translate Tickets to Italian

on:
  push:
    paths:
      - '.github/workflows/translate_tickets_it.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install translation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install polib argostranslate deep-translator

      - name: Build complete Italian gettext catalogs
        shell: bash
        run: |
          cat > /tmp/translate_tickets.py <<'PY'
          import json
          import re
          from pathlib import Path

          import polib

          try:
              import argostranslate.package
              import argostranslate.translate
              ARGOS = True
          except Exception:
              ARGOS = False

          google = None
          cache = {}

          # Protect formatting, commands/placeholders, Discord markup and URLs from translation.
          PROTECTED = re.compile(
              r'(https?://[^\s<>]+|'
              r'`[^`\n]+`|'
              r'\{[^{}\n]+\}|'
              r'\[[^\]\n]{1,40}\]|'
              r'<[^<>\n]+>|'
              r'%\([^)]+\)[#0\- +]?[0-9]*(?:\.[0-9]+)?[a-zA-Z]|'
              r'%(?:[#0\- +]?[0-9]*(?:\.[0-9]+)?)?[a-zA-Z])'
          )

          def setup_argos():
              if not ARGOS:
                  return False
              try:
                  argostranslate.package.update_package_index()
                  packages = argostranslate.package.get_available_packages()
                  pkg = next(p for p in packages if p.from_code == 'en' and p.to_code == 'it')
                  path = pkg.download()
                  argostranslate.package.install_from_path(path)
                  return True
              except Exception as exc:
                  print(f'Argos setup failed, falling back to GoogleTranslator: {exc}')
                  return False

          use_argos = setup_argos()

          def raw_translate(text: str) -> str:
              global google
              if not text or not text.strip():
                  return text
              if text in cache:
                  return cache[text]
              result = text
              try:
                  if use_argos:
                      result = argostranslate.translate.translate(text, 'en', 'it')
                  else:
                      if google is None:
                          from deep_translator import GoogleTranslator
                          google = GoogleTranslator(source='en', target='it')
                      result = google.translate(text)
              except Exception as exc:
                  print(f'Translation failed for {text!r}: {exc}')
                  # Retry once with Google if Argos failed on an individual string.
                  try:
                      if google is None:
                          from deep_translator import GoogleTranslator
                          google = GoogleTranslator(source='en', target='it')
                      result = google.translate(text)
                  except Exception as fallback_exc:
                      print(f'Fallback failed for {text!r}: {fallback_exc}')
                      result = text
              cache[text] = result
              return result

          def translate_text(text: str) -> str:
              if not text:
                  return text
              # Translate only unprotected pieces, preserving placeholders byte-for-byte.
              out = []
              pos = 0
              for match in PROTECTED.finditer(text):
                  chunk = text[pos:match.start()]
                  out.append(raw_translate(chunk) if chunk.strip() else chunk)
                  out.append(match.group(0))
                  pos = match.end()
              tail = text[pos:]
              out.append(raw_translate(tail) if tail.strip() else tail)
              return ''.join(out)

          catalogs = [
              Path('tickets/locales/messages.pot'),
              Path('tickets/commands/locales/messages.pot'),
              Path('tickets/common/locales/messages.pot'),
          ]

          for pot_path in catalogs:
              po = polib.pofile(str(pot_path))
              po.metadata = dict(po.metadata)
              po.metadata.update({
                  'Project-Id-Version': 'vrt-cogs Tickets Italian',
                  'PO-Revision-Date': '2026-09-14 00:00+0000',
                  'Last-Translator': 'danyx64 / automated Italian adaptation',
                  'Language-Team': 'Italian',
                  'Language': 'it_IT',
                  'MIME-Version': '1.0',
                  'Content-Type': 'text/plain; charset=UTF-8',
                  'Content-Transfer-Encoding': '8bit',
                  'Plural-Forms': 'nplurals=2; plural=(n != 1);',
                  'X-Crowdin-Language': 'it',
              })
              for entry in po:
                  if entry.obsolete:
                      continue
                  if entry.msgid_plural:
                      entry.msgstr_plural[0] = translate_text(entry.msgid)
                      entry.msgstr_plural[1] = translate_text(entry.msgid_plural)
                  else:
                      entry.msgstr = translate_text(entry.msgid)
              out = pot_path.with_name('it-IT.po')
              po.save(str(out))
              print(f'Wrote {out} with {len(po)} entries')

          # Translate repository metadata without touching runtime configuration/data models.
          info_path = Path('tickets/info.json')
          info = json.loads(info_path.read_text(encoding='utf-8'))
          info['description'] = 'Sistema avanzato di ticket di supporto Discord multi-pannello con pulsanti.'
          info['short'] = 'Sistema avanzato di ticket di supporto'
          info['install_msg'] = 'Grazie per aver installato Tickets! Usa `[p]tickets setuphelp` per iniziare. La traduzione italiana usa la locale `it-IT` di Red.'
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python /tmp/translate_tickets.py

      - name: Validate configuration compatibility
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Config.get_conf(self, 117117, force_registration=True)' tickets/tickets.py
          grep -F 'self.config.register_global(db={})' tickets/tickets.py
          test -f tickets/common/models.py
          test -f tickets/locales/it-IT.po
          test -f tickets/commands/locales/it-IT.po
          test -f tickets/common/locales/it-IT.po
          python -m compileall -q tickets

      - name: Commit Italian translation
        shell: bash
        run: |
          set -euo pipefail
          git add tickets/info.json tickets/locales/it-IT.po tickets/commands/locales/it-IT.po tickets/common/locales/it-IT.po
          if git diff --cached --quiet; then
            echo 'No translation changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add complete Italian localization for Tickets'
          git push origin HEAD:main
