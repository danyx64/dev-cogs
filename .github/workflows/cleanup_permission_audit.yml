name: Clean permission audit artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup_permission_audit.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated Python bytecode
        shell: bash
        run: |
          find ageguard leavefeed welcome serverlogger nitrorole hierarchyadmin -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "DanyX64"
          git config user.email "124602162+danyx64@users.noreply.github.com"
          git add -A ageguard leavefeed welcome serverlogger nitrorole hierarchyadmin
          if ! git diff --cached --quiet; then
            git commit -m "Remove permission audit bytecode"
            git push
          fi
