name: Fix Tickets localization finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix_finalize_tickets.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix polib context field and retrigger finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/finalize_tickets_it.yml')
          s = p.read_text(encoding='utf-8')
          old = 'context=entry.context,'
          new = 'msgctxt=entry.msgctxt,'
          if old not in s:
              raise SystemExit('expected finalizer line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix_finalize_tickets.yml
          git config user.name "DanyX64"
          git config user.email "124602162+danyx64@users.noreply.github.com"
          git add -A
          git commit -m "Fix Tickets localization finalizer"
          git push
